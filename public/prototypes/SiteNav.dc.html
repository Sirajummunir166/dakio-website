  <div style="max-width:1200px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; gap:24px;">

        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{ caret }}"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <a href="Dakio Nova.dc.html" style="{{ novaStyle }}" style-hover="color:#1A1D12">Nova</a>
      <a href="Dakio Switch.dc.html" style="{{ switchStyle }}" style-hover="color:#1A1D12">Switch to Dakio</a>
      <a href="Dakio Pricing.dc.html" style="{{ pricingStyle }}" style-hover="color:#1A1D12">Pricing</a>
    </div>
    <sc-if value="{{ hasLang }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ onLang }}" title="Switch language" style="display:flex; padding:3px; border-radius:99px; background:rgba(26,29,18,0.07); cursor:pointer; font-size:11.5px; font-weight:700;">

      </div>
    </sc-if>
    <a href="#" style="font-size:14px; font-weight:600; color:#1A1D12;">Log in</a>
    <a href="{{ ctaHref }}" style="display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:99px; background:#1A1D12; color:#C6F035; font-size:13.5px; font-weight:700; white-space:nowrap;" style-hover="transform:translateY(-1px)">
      <span style="width:7px; height:7px; border-radius:99px; background:#C6F035; animation:nvPulse 2.2s infinite;"></span>{{ ctaLabel }}
    </a>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed; inset:0; z-index:-1;"></div>
    <div onMouseEnter="{{ openMenu }}" onMouseLeave="{{ scheduleClose }}" style="position:absolute; top:100%; left:0; right:0; padding:10px 28px 0;">
      <div onClick="{{ stop }}" style="max-width:1020px; margin:0 auto; border-radius:24px; background:#FBFBF4; border:1px solid rgba(26,29,18,0.08); box-shadow:0 34px 80px rgba(26,29,18,0.22); padding:22px; display:grid; grid-template-columns:1fr 1.4fr 0.9fr; gap:20px; animation:nvDrop .18s ease both;">
        <div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:8.5px; font-weight:600; letter-spacing:0.14em; color:#3E7A45; padding:0 10px;">RUN BY NOVA</div>
          <div style="display:flex; flex-direction:column; gap:2px; margin-top:10px;">
            <sc-for list="{{ novaItems }}" as="it" hint-placeholder-count="2">
              <a href="{{ it.href }}" style="display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px;" style-hover="background:#F0EFE4">
                <span style="width:38px; height:38px; border-radius:12px; background:#14170E; color:#C6F035; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; flex-shrink:0;">{{ it.mono }}</span>
                <span style="min-width:0;"><span style="display:block; font-size:13.5px; font-weight:700;">{{ it.n }}</span><span style="display:block; font-size:11px; color:#6B6D60; margin-top:1px;">{{ it.d }}</span></span>
              </a>
            </sc-for>
          </div>
        </div>
        <div style="border-left:1px solid rgba(26,29,18,0.07); padding-left:20px;">
          <div style="font-family:'IBM Plex Mono',monospace; font-size:8.5px; font-weight:600; letter-spacing:0.14em; color:#3E7A45; padding:0 10px;">BUILD &amp; GROW</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; margin-top:10px;">
            <sc-for list="{{ buildItems }}" as="it" hint-placeholder-count="4">
              <a href="{{ it.href }}" style="display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px;" style-hover="background:#F0EFE4">
                <span style="width:38px; height:38px; border-radius:12px; background:#EEF4D4; color:#3A5212; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; flex-shrink:0;">{{ it.mono }}</span>
                <span style="min-width:0;"><span style="display:block; font-size:13.5px; font-weight:700;">{{ it.n }}</span><span style="display:block; font-size:11px; color:#6B6D60; margin-top:1px;">{{ it.d }}</span></span>
              </a>
            </sc-for>
          </div>
        </div>
        <a href="Dakio Home.dc.html#rooms" style="display:flex; flex-direction:column; justify-content:space-between; border-radius:16px; background:#0F120B; color:#E9EFDC; padding:18px;" style-hover="transform:translateY(-2px)">
          <div>
            <span style="display:inline-block; width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #F4FFD6, #C6F035 45%, #6FA524 90%);"></span>
            <div style="font-size:14.5px; font-weight:800; margin-top:10px; color:#FBFBF4;">The 60-second tour</div>
            <div style="font-size:11px; color:#A9AD98; margin-top:4px; line-height:1.55;">Every room, clickable — real product, not mockups.</div>
          </div>
          <div style="display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:#C6F035; margin-top:14px;">Take it <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
        </a>
        <div style="grid-column:1 / -1; display:flex; align-items:center; gap:16px; padding:12px 10px 2px; border-top:1px solid rgba(26,29,18,0.08); flex-wrap:wrap;">

          <a href="Dakio About.dc.html" style="font-size:12.5px; font-weight:700; color:#6B6D60;" style-hover="color:#1A1D12">About</a>

          <a href="Dakio Contact.dc.html" style="font-size:12.5px; font-weight:700; color:#6B6D60;" style-hover="color:#1A1D12">Contact</a>
          <span style="margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:0.1em; color:#878B76;">৳ BANGLADESH · GOING GLOBAL SOON</span>
